  <!--
    ════════════════════════════════════════════════════════════════════════
    YOUR WORDS GO HERE  (Emmanuel)

    Each <template data-note="..."> below is one of your notes. The page reads
    the text inside it. Leave one empty and that note simply never appears,
    so nothing half-written can show. Keep them short, a sentence or three.
    Line breaks become paragraphs. Suggested drafts sit in the comments.
    ════════════════════════════════════════════════════════════════════════
  -->

  <!-- Layer 1, under our first FaceTime in the call log (after she answers). Draft:
       "Seventy-seven seconds. I had no idea." -->
  <template data-note="first-call">"Seventy-seven seconds. I had no idea I'd fall in love with you and yearn to spend every second with you"</template>

  <!-- Layer 2, the first long call. Draft:
       "I remember not wanting to be the one to say goodnight." -->
  <template data-note="first-long-call">"I remember not wanting to be the one to say goodnight."</template>

  <!-- Layer 5, the night you said yes. Shown after she taps 2:00 AM. Draft:
       "You said yes on this call. I wiped a tear and you saw." -->
  <template data-note="said-yes">"You said yes on this call. Time stood still as our love gained momentum."</template>

  <!-- Layer 7, the longest call. Shown after she taps April 15. Draft:
       "Twenty-nine hours, and I still didn't want to hang up." -->
  <template data-note="longest-call">"Twenty-nine hours, and I still didn't want to hang up."</template>

  <!-- Layer 7, Christmas. Draft:
       "All of Christmas Day, together. Our first." -->
  <template data-note="christmas">"All of Christmas Day, together. Our first."</template>

  <!-- Layer 9, the visits. One line for all four, or leave it. Draft:
       "The quiet weeks in the data are my favourite ones." -->
  <template data-note="visits">"I got to see your FACE this TIME☺️. The real thing, not just pixels but the one I picked💖."</template>     

  <!-- Layer 10, the 1,000 hour milestone. Draft:
       "A thousand hours by December. We were just getting started." -->
  <template data-note="milestone-1000">"A thousand hours by November. We were just getting started."</template>

  <!-- Layer 12, the sunrises. Draft:
       "You are the sun I kept waiting up for." -->
  <template data-note="sunrises">"You are the sun I keep waiting up for."</template>

  <!-- Layer 13, her year. Draft:
       "Half of your twenty-fourth year, you spent looking at me. I don't take that lightly." -->
  <template data-note="her-year">"Half of your twenty-fourth year, you spent looking at me. I don't take that lightly."</template>

  <!-- Layer 14, THE LETTER. The one that matters. The page shows "Dear Miracle" above whatever you write.
       Draft, replace all of it:
       "I added it up because I wanted you to see it the way I do.
        Every one of these hours was a choice, and you kept choosing me.
        Happy birthday, baby girl. Here's to the next trip around the sun." -->
  <template data-note="letter">"I added it up because I wanted you to see it the way I do.
        Every one of these hours was a choice, and you kept choosing me.
        Happy birthday, baby girl. Here's to the next trip around the sun."</template>

  <!-- Layer 15, the small blessing under "Happy 25th trip around the sun, my Miracle". Edit freely. -->
  <template data-note="prayer">May the Light that brought us together go ahead of you into every room.
May it carry you through your darkest days and stay up with you on your brightest nights, the way we always have.
And may every trip around the sun bring you more joy than the last.</template>
