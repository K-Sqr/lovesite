    ════════════════════════════════════════════════════════════════════════
    YOUR WORDS GO HERE  (Emmanuel)

    Each <template data-note="..."> below is one of your notes. The page reads
    the text inside it. Leave one empty and that note simply never appears,
    so nothing half-written can show. Keep them short, a sentence or three.
    Line breaks become paragraphs. Suggested drafts sit in the comments.
    ════════════════════════════════════════════════════════════════════════
  -->

  <!-- Layer 1, under the first call. Draft:
       "Seventy-seven seconds. I had no idea." -->
  <template data-note="first-call"></template>

  <!-- Layer 2, the first long call. Draft:
       "I remember not wanting to be the one to say goodnight." -->
  <template data-note="first-long-call"></template>

  <!-- Layer 5, the night you said yes. Shown after she taps 2:00 AM. Draft:
       "You said yes on this call. I wiped a tear and you saw." -->
  <template data-note="said-yes"></template>

  <!-- Layer 7, the longest call. Shown after she taps April 15. Draft:
       "Twenty-nine hours, and I still didn't want to hang up." -->
  <template data-note="longest-call"></template>

  <!-- Layer 7, Christmas. Draft:
       "All of Christmas Day, together. Our first." -->
  <template data-note="christmas"></template>

  <!-- Layer 9, the visits. One line for all four, or leave it. Draft:
       "The quiet weeks in the data are my favourite ones." -->
  <template data-note="visits"></template>

  <!-- Layer 10, the 1,000 hour milestone. Draft:
       "A thousand hours by December. We were just getting started." -->
  <template data-note="milestone-1000"></template>

  <!-- Layer 12, the sunrises. Draft:
       "You are the sun I kept waiting up for." -->
  <template data-note="sunrises"></template>

  <!-- Layer 13, her year. Draft:
       "Half of your twenty-fourth year, you spent looking at me. I don't take that lightly." -->
  <template data-note="her-year"></template>

  <!-- Layer 14, THE LETTER. The one that matters. The page shows "Dear Miracle" above whatever you write.
       Draft, replace all of it:
       "I added it up because I wanted you to see it the way I do.
        Every one of these hours was a choice, and you kept choosing me.
        Happy birthday, baby girl. Here's to the next trip around the sun." -->
  <template data-note="letter"></template>

  <!-- Layer 15, the birthday finale, after the sun blooms. Draft:
