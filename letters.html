<body>

  <!-- ═══ NAVBAR (rendered by src/modules/siteChrome.js) ═══ -->
  <nav class="site-nav" id="siteNav"></nav>

  <main class="letters-page">

    <!-- Locked: the first thing she sees. Warm, and it gives nothing away.
         Nothing about the letters exists in the DOM until src/letters.js unlocks. -->
    <section class="letters-locked" id="lettersLocked" aria-labelledby="lettersLockedLine">
      <p class="letters-locked__line" id="lettersLockedLine">These are just for you. The passcode is the one you already know.</p>
      <form class="letters-locked__form" id="lettersPasscodeForm" autocomplete="off" hidden>
        <label class="sr-only" for="lettersPasscode">Passcode</label>
        <input class="usm-input letters-locked__input" id="lettersPasscode" type="password" autocomplete="off" placeholder="Passcode" />
        <button class="usm-btn usm-btn--primary" type="submit" id="lettersPasscodeSubmit">Open</button>
      </form>
      <p class="letters-locked__note" id="lettersPasscodeNote" aria-live="polite"></p>
    </section>

    <!-- Archive: cards rendered by src/letters.js after authentication -->
    <section class="letters-archive" id="lettersArchive" hidden>
      <header class="letters-header">
        <p class="letters-eyebrow">A drawer, just for you</p>
        <h1>Letters</h1>
        <p class="letters-lede">Everything I've written you, kept in one place.</p>
        <p class="letters-count" id="lettersCount" hidden></p>
      </header>
      <div class="letters-list" id="lettersList"></div>
    </section>

    <!-- Reading view: one letter at a time, held in memory for this view only -->
    <section class="letters-reading" id="lettersReading" hidden></section>

  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <!-- ═══ MUSIC (rendered by src/modules/siteChrome.js) ═══ -->
  <div id="siteMusic"></div>

</body>
